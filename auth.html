<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Connecting to Google Drive...</title>
  <style>
    body{font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f0efe9;color:#1a1a1a}
    .box{text-align:center;padding:2rem}
    .spinner{width:36px;height:36px;border:3px solid #ddd;border-top-color:#1d9e75;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem}
    @keyframes spin{to{transform:rotate(360deg)}}
    p{font-size:15px;color:#6b6b6b;margin:0}
  </style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <p id="msg">Connecting to Google Drive…</p>
</div>
<script>
  (function(){
    const hash   = window.location.hash.slice(1);
    const params = new URLSearchParams(hash);
    const token  = params.get('access_token');
    const error  = params.get('error');

    if(token){
      // Send token back to the opener (the tracker app)
      if(window.opener){
        window.opener.postMessage({type:'gd_token', token:token}, '*');
        document.getElementById('msg').textContent = 'Connected! You can close this tab.';
        setTimeout(()=>window.close(), 1000);
      } else {
        // Opened directly — store in localStorage and close
        localStorage.setItem('gd:pendingToken', token);
        document.getElementById('msg').textContent = 'Connected! You can close this tab.';
        setTimeout(()=>window.close(), 1000);
      }
    } else if(error){
      if(window.opener){
        window.opener.postMessage({type:'gd_error', error:error}, '*');
      }
      document.getElementById('msg').textContent = 'Sign-in failed: ' + error + '. You can close this tab.';
    } else {
      document.getElementById('msg').textContent = 'No token received. You can close this tab.';
    }
  })();
</script>
</body>
</html>
