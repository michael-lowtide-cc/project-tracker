<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Connecting to Google Drive...</title>
  <style>
    body { font-family: -apple-system, sans-serif; display: flex; align-items: center;
           justify-content: center; height: 100vh; margin: 0; background: #E0E0DB; color: #2A2829; }
    .box { text-align: center; padding: 2rem; }
    .spinner { width: 32px; height: 32px; border: 3px solid #ddd; border-top-color: #9151a0;
               border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <div id="msg">Connecting to Google Drive...</div>
</div>
<script>
  (function() {
    // Parse token from URL hash
    const hash = window.location.hash.slice(1);
    const params = new URLSearchParams(hash);
    const token = params.get('access_token');
    const error = params.get('error');

    if (token) {
      // Write token to localStorage — main window listens for 'storage' event
      // Use a timestamped key so the event always fires even on repeat auths
      const payload = JSON.stringify({ token: token, ts: Date.now() });
      localStorage.setItem('gd_auth_token', payload);
      // Also try postMessage as fallback (works if COOP not blocking)
      try {
        if (window.opener && window.opener.postMessage) {
          window.opener.postMessage({ type: 'gd_token', token: token }, '*');
        }
      } catch(e) { /* COOP blocked — localStorage method will handle it */ }
      document.getElementById('msg').textContent = 'Connected! Closing...';
      setTimeout(() => window.close(), 800);
    } else if (error) {
      localStorage.setItem('gd_auth_token', JSON.stringify({ error: error, ts: Date.now() }));
      try {
        if (window.opener) window.opener.postMessage({ type: 'gd_error', error: error }, '*');
      } catch(e) {}
      document.getElementById('msg').textContent = 'Auth failed: ' + error;
      setTimeout(() => window.close(), 2000);
    } else {
      document.getElementById('msg').textContent = 'No token received.';
    }
  })();
</script>
</body>
</html>
